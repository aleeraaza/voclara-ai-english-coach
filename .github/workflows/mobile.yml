name: mobile

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/api-types/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["apps/mobile/**", "packages/api-types/**", ".github/workflows/mobile.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: API types are up to date with openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- ../../packages/api-types/schema.d.ts
      - run: npm run typecheck
      - run: npx expo lint
      - run: npm test -- --ci
