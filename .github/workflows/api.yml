name: api

on:
  push:
    branches: [main]
    paths: ["apps/api/**", "Cargo.toml", "Cargo.lock", ".github/workflows/api.yml"]
  pull_request:
    paths: ["apps/api/**", "Cargo.toml", "Cargo.lock", ".github/workflows/api.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voclara
          POSTGRES_PASSWORD: voclara
          POSTGRES_DB: voclara
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voclara"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://voclara:voclara@localhost:5432/voclara
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
